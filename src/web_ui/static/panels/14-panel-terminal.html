<!-- 터미널 · btop · 이 PC 의 셸을 브라우저 안에서 연다 · §6-311 -->
<section class="terminal-panel workspace-panel hidden" data-workspace-panel="terminal" aria-label="터미널">
  <div class="section-head workspace-page-head">
    <div>
      <strong>터미널</strong>
      <small id="terminalSubtitle">이 PC 의 셸 · 프로그램을 돌리는 계정으로 실행</small>
    </div>
    <div class="terminal-head-actions">
      <div class="terminal-picker" id="terminalPicker" role="tablist" aria-label="프로그램 고르기">
        <button type="button" role="tab" class="active" data-terminal-tab="shell" aria-selected="true">터미널</button>
        <button type="button" role="tab" data-terminal-tab="btop" aria-selected="false">btop</button>
      </div>
      <button id="terminalReconnectButton" type="button">다시 연결</button>
      <button id="terminalDisconnectButton" type="button">끊기</button>
    </div>
  </div>

  <div class="terminal-status" id="terminalStatus" role="status" aria-live="polite">연결 전</div>

  <div class="terminal-screens">
    <div class="terminal-screen" data-terminal-screen="shell" aria-label="터미널 화면"></div>
    <div class="terminal-screen hidden" data-terminal-screen="btop" aria-label="btop 화면"></div>
  </div>

  <div class="terminal-footer">
    <span>붙여넣기 <code>Ctrl+Shift+V</code> · 복사는 드래그 후 <code>Ctrl+Shift+C</code> · 탭을 떠나도 세션은 유지 · 「끊기」로 종료</span>
    <span class="terminal-footer-warning">이 화면을 열 수 있는 사람은 누구나 이 PC 에서 명령을 실행할 수 있습니다 · 외부망 PC 는 <code>MOTION_WEB_TERMINAL=0</code> 으로 끄세요</span>
  </div>
</section>
