# 무조코(시뮬) 미리보기 명령 · 복사해서 animation_preview.yaml 로 저장
#
# **로봇 팩 우선** · 시스템 정보 → 로봇 팩으로 올린 팩에 preview.yaml 이 있으면
# 그것을 쓰고 이 파일은 보지 않는다 · 팩이 없거나 팩에 preview.yaml 이 없을 때만
# 이 파일을 쓴다 (형식은 팩의 preview.yaml 과 같다).
#
# 두 단계:
#   precompute  무거운 물리 계산 · 업로드되면 자동 시작 · result 파일이
#               생기면 「계산 끝」 → 그때부터 재생·같이 보기가 켜진다
#   preview     (선택 · 서버는 쓰지 않음) 개발 PC 에서 replay_run.py 를 손으로 돌릴 때
#               참고용 · 보기는 웹 화면 「3D 보기 (웹)」·「MuJoCo 같이 보기」가 한다 (7)
#
# 치환: {motion_path} = 애니메이션 .json 경로 · {motion_stem} = 확장자 뺀 경로
#       {result} = precompute.result 경로 · {fps} = 화면에서 고른 30/60/120/144
#       {stack} = 스택(워크스페이스) 루트 · {pack} = 로봇 팩 폴더 (robot_pack/)
# 셸을 거치지 않으므로 인자를 한 줄씩 적는다 · cwd = 명령 실행 폴더
# (팩 preview.yaml 에서 생략하면 팩 폴더 · 이 파일에서 생략하면 스택 루트).
#
# 공용 실행기 = scripts/sim/ (sim_run · replay_run · view_run) · 로봇 값은 전부 팩에서.
# precompute 없이 preview 만 적으면 게이트 없이 바로 튼다(direct) ·
# 물리 없는 kinematic 뷰어처럼 계산이 필요 없는 로봇용.

precompute:
  command:
    - uv
    - run
    - --no-project
    - --with=mujoco
    - --with=numpy
    - --with=pyyaml
    - python
    - '{stack}/scripts/sim/sim_run.py'
    - '{pack}'
    - '{motion_path}'
    - '{motion_stem}.sim.csv'
  result: '{motion_stem}.sim.npz'   # sim_run 이 csv 옆에 npz 를 남긴다

# preview:                                  # 선택 · 개발 PC 참고용 · 서버는 실행하지 않는다
