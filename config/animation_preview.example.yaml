# 무조코(시뮬) 미리보기 명령 · 복사해서 animation_preview.yaml 로 저장
#
# 로봇마다 모델·스크립트가 다르다 · 플랫폼은 이 파일의 명령 틀만 알고,
# 내용은 각 로봇 PC 가 채운다 (아래는 플로팅 헤드 예시).
#
# 두 단계:
#   precompute  무거운 물리 계산 · 업로드되면 자동 시작 · result 파일이
#               생기면 「계산 끝」 → 그때부터 재생·같이 보기가 켜진다
#   preview     계산 결과를 그대로 트는 뷰어 · 가볍다 · 모터 재생과 동시 실행
#
# 치환: {motion_path} = 애니메이션 .json 경로 · {motion_stem} = 확장자 뺀 경로
#       {result} = precompute.result 경로 · {fps} = 화면에서 고른 30/60/120/144
# 셸을 거치지 않으므로 인자를 한 줄씩 적는다 · cwd = 명령 실행 폴더.
#
# precompute 없이 preview 만 적으면 게이트 없이 바로 튼다(direct) ·
# 물리 없는 kinematic 뷰어처럼 계산이 필요 없는 로봇용.

precompute:
  command:
    - uv
    - run
    - --no-project
    - --with=mujoco
    - --with=numpy
    - python
    - sim_run.py
    - ../fh_1800_wires_R011.xml
    - '{motion_path}'
    - '{motion_stem}.sim.csv'
  result: '{motion_stem}.sim.npz'   # sim_run 이 csv 옆에 npz 를 남긴다

preview:
  command:
    - uv
    - run
    - --no-project
    - --with=mujoco
    - --with=numpy
    - python
    - replay_run.py       # Space 일시정지 · 방향키 탐색·배속 · 모델 경로는 npz 안에
    - '{result}'
    - '{fps}'

fps: 60
cwd: /home/USER/floating_share/floating_1800/sim/scripts
