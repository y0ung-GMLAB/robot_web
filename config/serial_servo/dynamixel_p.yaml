# 다이나믹셀 P (PH · PM) 기본 · Protocol 2.0 (dxl2) · 수정 목록 158 · 실물 미검증 (설계 §9 D-1)
# 저장 때 `serial_params.write_param_file` 이 이 파일 + 모델 제어표로 `config/serial_params/driver_<id>.yaml` 을 만든다
protocol:
  broadcast_id: 254
  read: 2
  write: 3
  status: 85
  bulk_read: 146
  bulk_write: 147
  reboot: 8

model_file: ""

# Profile Acceleration raw 1 = 1 rev/min² = 0.1 deg/s² (X 는 214.577 rev/min²)
acceleration_unit: 0.1

items:
  - { id: 30, name: "Operating Mode", type: s8, value: 4 }

# P 시리즈 Extended Position 목표 위치 · int32 전 범위
extended_position_raw_limit: 2147483647

interfaces:
  - { id: 98, index: 0 }
  - { id: 0, name: "Torque Enable", type: u8 }
  - { id: 1, name: "Goal Position", type: s32 }
  - { id: 2, name: "Goal Velocity", type: s32 }
  - { id: 3, name: "Goal Current", type: s16 }
  - { id: 99, index: 0 }
  - { id: 4, name: "Torque Enable", type: u8 }
  - { id: 5, name: "Hardware Error Status", type: u8 }
  - { id: 6, name: "Present Position", type: s32 }
  - { id: 7, name: "Present Velocity", type: s32 }
  - { id: 8, name: "Present Current", type: s16 }
