# 다이나믹셀 X · XL330 · XC330 · MX(2.0) 기본 · Protocol 2.0 (dxl2) · 수정 목록 158
# 저장 때 `serial_params.write_param_file` 이 이 파일 + 모델 제어표로 `config/serial_params/driver_<id>.yaml` 을 만든다
# model_file · 모델 제어표 절대경로로 바뀐다 · 전류 없는 모델(XL430 · XC430 · 2XL · 2XC · MX-28)은 전류 칸 optional
# XM540-W150 · W270 결과 = 옛 `config/dynamixel_xm540_*.yaml` (회귀 시험 `test_ac_motor_config_unchanged.py`)
protocol:
  broadcast_id: 254
  read: 2
  write: 3
  status: 85
  bulk_read: 146
  bulk_write: 147
  reboot: 8         # 하드웨어 오류 해제 (수정 목록 24)

model_file: ""

# Operating Mode 4 = Extended Position(멀티턴) · 값은 드라이버 설정 profile_position_value 로 덮어쓴다
items:
  - { id: 30, name: "Operating Mode", type: s8, value: 4 }

# Extended Position Goal Position 허용 raw (±1,048,575 · ±256 바퀴)
extended_position_raw_limit: 1048575

interfaces:
  - { id: 98, index: 0 }
  - { id: 0, name: "Torque Enable", type: u8 }
  - { id: 1, name: "Goal Position", type: s32 }
  - { id: 2, name: "Goal Velocity", type: s32 }
  - { id: 3, name: "Goal Current", type: s16 }
  - { id: 99, index: 0 }
  - { id: 4, name: "Torque Enable", type: u8 }
  - { id: 5, name: "Hardware Error Status", type: u8 }
  - { id: 6, name: "Present Position", type: s32 }
  - { id: 7, name: "Present Velocity", type: s32 }
  - { id: 8, name: "Present Current", type: s16 }
